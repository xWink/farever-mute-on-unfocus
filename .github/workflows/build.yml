name: Build mod

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Configure haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install HLX dependencies
        run: |
          haxelib git hlx-runtime https://github.com/hlx-framework/hlx-core.git main hlx-runtime/src
          haxelib git hl-imgui https://github.com/laymain/farever-mods.git main imgui/hl-imgui/src

      - name: Compile
        run: haxe compile.hxml

      - name: Package
        run: |
          mkdir -p package/hlx/mods/mute-unfocused
          cp build/mute-unfocused/mute-unfocused.hl package/hlx/mods/mute-unfocused/
          printf "Requires HLX Core and the Farever ImGui plugin.\nInstall with Vortex, or extract the archive into the Farever game folder.\n" > package/hlx/mods/mute-unfocused/README.txt
          cd package
          zip -r ../farever-mute-on-unfocus.zip hlx

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: farever-mute-on-unfocus
          path: farever-mute-on-unfocus.zip

      - name: Publish release
        if: github.event.head_commit.message == 'Publish Vortex-compatible release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: Farever Mute on Unfocus v1.1.1
          body: Vortex-compatible archive. Install the ZIP directly with Vortex, or extract it into the Farever game directory for a manual installation.
          files: farever-mute-on-unfocus.zip
